<div class="multi-file-upload">
  <label class="d-block font-weight-bold mb-1 small" *ngIf="label">{{ label }}</label>
  <p class="text-muted small mb-2 mb-md-3" *ngIf="hint">{{ hint }}</p>

  <div
    class="drop-zone rounded text-center user-select-none"
    [ngClass]="zoneClass"
    [class.drag-over]="dragOver"
    (click)="onZoneClick($event)"
    (drop)="onDrop($event)"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    role="button"
    tabindex="0"
    (keydown.enter)="triggerBrowse()"
    (keydown.space)="$event.preventDefault(); triggerBrowse()">
    <i class="fas fa-cloud-upload-alt fa-3x mb-2 d-block text-primary opacity-75"></i>
    <strong class="d-block">Suelta archivos aquí</strong>
    <span class="small text-muted d-block mt-1">o haz clic para elegir · imágenes, PDF, Word, Excel</span>
    <button type="button" class="btn btn-sm btn-outline-primary mt-3" (click)="$event.stopPropagation(); triggerBrowse()">
      <i class="fas fa-folder-open mr-1"></i> Examinar
    </button>
  </div>

  <input
    #fileInput
    type="file"
    class="d-none"
    multiple
    [accept]="accept"
    (change)="onFileSelect($event)" />

  <div *ngIf="errors.length" class="alert alert-warning small py-2 mt-2 mb-0">
    <div *ngFor="let err of errors">{{ err }}</div>
  </div>

  <div *ngIf="lista.length > 0" class="mt-3">
    <div class="small text-muted mb-2 font-weight-bold text-primary">{{ lista.length }} archivo(s) listo(s) para enviar</div>
    <div class="row mx-n1">
      <div
        class="col-6 col-sm-4 col-md-3 px-1 mb-2"
        *ngFor="let f of lista; let i = index; trackBy: trackByIndex">
        <div class="card h-100 border shadow-sm preview-card">
          <div class="card-img-wrap bg-light d-flex align-items-center justify-content-center">
            <img
              *ngIf="esImagen(f)"
              [src]="previewUrl(f)"
              [alt]="f.name"
              class="preview-img" />
            <i *ngIf="!esImagen(f)" class="fas fa-file-alt fa-3x text-secondary"></i>
          </div>
          <div class="card-body p-1">
            <div class="small text-truncate" [title]="f.name">{{ f.name }}</div>
            <button
              type="button"
              class="btn btn-danger btn-sm btn-block mt-1 py-0"
              (click)="$event.stopPropagation(); removeAt(i)">
              <i class="fas fa-times mr-1"></i>Quitar
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
