<div class="row">
    <div class="col-md-9">
        <div class="card card-outline card-danger shadow-none">
            <div class="card-header border-0 mt-2">
                <h3 class="card-title text-danger font-weight-bold">
                    <i [class]="viewConfig.icon + ' mr-2'"></i> {{viewConfig.title}}
                </h3>
            </div>
            <div class="card-body bg-dark text-center p-5 rounded"
                style="min-height: 500px; display: flex; align-items: center; justify-content: center; flex-direction: column; overflow: hidden; position: relative">
                <!-- Simulación de Mapa -->
                <div
                    style="position: absolute; top:0; left:0; right:0; bottom:0; opacity: 0.1; background: url('https://upload.wikimedia.org/wikipedia/commons/4/4b/Mapa_de_Trujillo_Per%C3%BA.jpg') center center / cover;">
                </div>
                <div style="z-index: 2;">
                    <i class="fas fa-satellite-dish fa-4x text-danger mb-3"></i>
                    <h5 class="text-white">Motor de Georreferenciación</h5>
                    <p class="text-muted">Integra aquí la API de Google Maps / Leaflet para mapear focos de comercio
                        ambulatorio e infracciones.</p>
                </div>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card card-outline card-info">
            <div class="card-header bg-info text-white">
                <h3 class="card-title font-weight-bold"><i class="fas fa-filter mr-2"></i> Capas de Datos</h3>
            </div>
            <div class="card-body">
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="layer1" checked>
                    <label class="form-check-label text-success" for="layer1"><i class="fas fa-circle mr-1"></i>
                        Padrones Formales</label>
                </div>
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="layer2" checked>
                    <label class="form-check-label text-warning" for="layer2"><i class="fas fa-circle mr-1"></i> Puntos
                        de Riesgo ITSE</label>
                </div>
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="layer3" checked>
                    <label class="form-check-label text-danger" for="layer3"><i class="fas fa-circle mr-1"></i>
                        Sancionados (Clausuras)</label>
                </div>
                <hr>
                <div class="info-box bg-light shadow-sm">
                    <span class="info-box-icon"><i class="fas fa-exclamation-triangle text-danger"></i></span>
                    <div class="info-box-content">
                        <span class="info-box-text text-muted">Zonas Críticas</span>
                        <span class="info-box-number text-danger">12 Focos</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
