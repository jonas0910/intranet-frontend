<app-system-layout title="Gestión de Organización"
    subtitle="Configura la identidad institucional para todos los documentos del sistema"
    [breadcrumbs]="[{label: 'Administración'}, {label: 'Configuración'}, {label: 'Organización'}]">

    <div class="row">
        <div class="col-12">
            <div class="card elevation-1 card-outline card-primary" style="border-radius: 8px">

                <div class="card-header bg-white border-bottom py-3">
                    <h3 class="card-title mb-0">
                        <i class="fas fa-building mr-1 text-primary"></i> Información de la Organización
                    </h3>
                </div>

                <div class="card-body p-4">
                    <form (ngSubmit)="guardarOrganizacion()" #orgForm="ngForm">
                        <div class="row">
                            <!-- Logo Section -->
                            <div class="col-md-4 text-center border-right pr-md-4">
                                <div class="form-group">
                                    <label class="d-block font-weight-bold mb-3">Logo Institucional</label>
                                    <div class="logo-container p-3 border rounded mb-3 bg-light d-flex align-items-center justify-content-center shadow-sm"
                                        style="height: 240px; overflow: hidden; background-image: radial-gradient(#dee2e6 1px, transparent 1px); background-size: 20px 20px;">
                                        <img *ngIf="logoPreview" [src]="logoPreview" class="img-fluid"
                                            style="max-height: 100%; object-fit: contain;">
                                        <div *ngIf="!logoPreview" class="text-center text-muted">
                                            <i class="fas fa-image fa-4x mb-2"></i>
                                            <p class="small mb-0">Sin logo cargado</p>
                                        </div>
                                    </div>
                                    <input type="file" id="logoInput" class="d-none" (change)="onLogoSelected($event)"
                                        accept="image/*">
                                    <button type="button" class="btn btn-outline-primary btn-block btn-sm"
                                        onclick="document.getElementById('logoInput').click()">
                                        <i class="fas fa-upload mr-1"></i> Seleccionar Nuevo Logo
                                    </button>
                                    <div class="mt-3 p-2 bg-light rounded border">
                                        <small class="text-muted d-block italic">
                                            <i class="fas fa-info-circle mr-1"></i>
                                            Este logo se mostrará automáticamente en todos los PDF generados, facturas y
                                            reportes oficiales.
                                        </small>
                                    </div>
                                </div>
                            </div>

                            <!-- General Info Section -->
                            <div class="col-md-8 pl-md-4">
                                <div class="row">
                                    <div class="col-md-8 form-group">
                                        <label class="font-weight-bold">Nombre de la Organización <span
                                                class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <div class="input-group-prepend">
                                                <span class="input-group-text"><i class="fas fa-university"></i></span>
                                            </div>
                                            <input type="text" class="form-control" [(ngModel)]="organizacion.name"
                                                name="name" required placeholder="Nombre legal completo">
                                        </div>
                                    </div>
                                    <div class="col-md-4 form-group">
                                        <label class="font-weight-bold">RUC <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <div class="input-group-prepend">
                                                <span class="input-group-text"><i class="fas fa-id-card"></i></span>
                                            </div>
                                            <input type="text" class="form-control" [(ngModel)]="organizacion.ruc"
                                                name="ruc" maxlength="11" placeholder="Solo números">
                                        </div>
                                    </div>

                                    <div class="col-12 form-group">
                                        <label class="font-weight-bold">Dirección Legal</label>
                                        <div class="input-group">
                                            <div class="input-group-prepend">
                                                <span class="input-group-text"><i
                                                        class="fas fa-map-marker-alt"></i></span>
                                            </div>
                                            <input type="text" class="form-control" [(ngModel)]="organizacion.address"
                                                name="address" placeholder="Sede principal o domicilio fiscal">
                                        </div>
                                    </div>

                                    <div class="col-md-6 form-group">
                                        <label class="font-weight-bold">Teléfono de Contacto</label>
                                        <div class="input-group">
                                            <div class="input-group-prepend">
                                                <span class="input-group-text"><i class="fas fa-phone"></i></span>
                                            </div>
                                            <input type="text" class="form-control" [(ngModel)]="organizacion.phone"
                                                name="phone">
                                        </div>
                                    </div>
                                    <div class="col-md-6 form-group">
                                        <label class="font-weight-bold">Correo Electrónico Institucional</label>
                                        <div class="input-group">
                                            <div class="input-group-prepend">
                                                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                            </div>
                                            <input type="email" class="form-control" [(ngModel)]="organizacion.email"
                                                name="email">
                                        </div>
                                    </div>

                                    <div class="col-md-6 form-group">
                                        <label class="font-weight-bold">Representante / Responsable</label>
                                        <div class="input-group">
                                            <div class="input-group-prepend">
                                                <span class="input-group-text"><i class="fas fa-user-tie"></i></span>
                                            </div>
                                            <input type="text" class="form-control"
                                                [(ngModel)]="organizacion.responsable_name" name="responsable_name"
                                                placeholder="Nombre completo">
                                        </div>
                                    </div>
                                    <div class="col-md-6 form-group">
                                        <label class="font-weight-bold">Cargo del Responsable</label>
                                        <div class="input-group">
                                            <div class="input-group-prepend">
                                                <span class="input-group-text"><i class="fas fa-briefcase"></i></span>
                                            </div>
                                            <input type="text" class="form-control"
                                                [(ngModel)]="organizacion.responsable_cargo" name="responsable_cargo"
                                                placeholder="Cargo directivo">
                                        </div>
                                    </div>

                                    <div class="col-12 form-group">
                                        <label class="font-weight-bold">Sitio Web</label>
                                        <div class="input-group">
                                            <div class="input-group-prepend">
                                                <span class="input-group-text"><i class="fas fa-globe"></i></span>
                                            </div>
                                            <input type="url" class="form-control" [(ngModel)]="organizacion.website"
                                                name="website" placeholder="https://www.ejemplo.gob.pe">
                                        </div>
                                    </div>
                                </div>

                                <div class="border-top pt-4 mt-4 d-flex justify-content-between align-items-center">
                                    <div class="text-muted small">
                                        <span class="text-danger">*</span> Campos obligatorios
                                    </div>
                                    <button type="submit" class="btn btn-primary px-5 shadow-sm"
                                        [disabled]="!orgForm.form.valid || guardandoOrganizacion">
                                        <i class="fas"
                                            [ngClass]="guardandoOrganizacion ? 'fa-spinner fa-spin' : 'fa-save mr-2'"></i>
                                        {{ guardandoOrganizacion ? ' Guardando...' : ' Guardar Configuración
                                        Institucional' }}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</app-system-layout>
