<div class="modal-header border-0" [style.background-color]="L.modalHeaderBg" [style.color]="L.modalHeaderText">
  <h5 class="modal-title">
    <i class="fas fa-desktop mr-2"></i> Previsualización: Layout Completo
  </h5>
  <button type="button" class="close" [style.color]="L.modalHeaderText" aria-label="Close" (click)="activeModal.dismiss()">
    <span aria-hidden="true">&times;</span>
  </button>
</div>
<div class="modal-body p-0">
  <app-layout-shell-preview [layout]="layout"></app-layout-shell-preview>
</div>
<div class="modal-footer bg-light">
  <button type="button" class="btn btn-secondary btn-sm" (click)="activeModal.close()">Cerrar</button>
</div>
