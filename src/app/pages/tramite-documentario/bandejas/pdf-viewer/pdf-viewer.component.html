<div class="pdf-viewer-container">
  <!-- Barra de herramientas -->
  <div class="pdf-toolbar bg-primary text-white p-2 d-flex justify-content-between align-items-center flex-wrap">
    <div class="d-flex align-items-center gap-2 flex-wrap">
      <!-- Navegación de páginas -->
      <button 
        class="btn btn-sm btn-light" 
        (click)="prevPage()" 
        [disabled]="currentPage <= 1"
        title="Página anterior">
        <i class="fas fa-chevron-left"></i>
      </button>
      
      <div class="input-group input-group-sm" style="width: 120px;">
        <input 
          type="number" 
          class="form-control text-center" 
          [(ngModel)]="currentPage" 
          [min]="1" 
          [max]="totalPages"
          (change)="goToPage(currentPage)"
          style="min-width: 60px;">
        <div class="input-group-append">
          <span class="input-group-text">/ {{ totalPages }}</span>
        </div>
      </div>
      
      <button 
        class="btn btn-sm btn-light" 
        (click)="nextPage()" 
        [disabled]="currentPage >= totalPages"
        title="Página siguiente">
        <i class="fas fa-chevron-right"></i>
      </button>

      <div class="vr mx-2"></div>

      <!-- Controles de zoom -->
      <button 
        class="btn btn-sm btn-light" 
        (click)="zoomOut()" 
        title="Alejar">
        <i class="fas fa-search-minus"></i>
      </button>
      
      <div class="input-group input-group-sm" style="width: 80px;">
        <input 
          type="number" 
          class="form-control text-center" 
          [(ngModel)]="zoomLevel" 
          [min]="50" 
          [max]="200"
          (change)="renderPage(currentPage)"
          style="min-width: 60px;">
        <div class="input-group-append">
          <span class="input-group-text">%</span>
        </div>
      </div>
      
      <button 
        class="btn btn-sm btn-light" 
        (click)="zoomIn()" 
        title="Acercar">
        <i class="fas fa-search-plus"></i>
      </button>
      
      <button 
        class="btn btn-sm btn-light" 
        (click)="resetZoom()" 
        title="Resetear zoom">
        <i class="fas fa-expand-arrows-alt"></i>
      </button>

      <div class="vr mx-2"></div>

      <!-- Rotación -->
      <button 
        class="btn btn-sm btn-light" 
        (click)="rotate()" 
        title="Rotar">
        <i class="fas fa-redo"></i>
      </button>

      <!-- Ajustes -->
      <div class="btn-group btn-group-sm">
        <button 
          class="btn btn-light dropdown-toggle" 
          type="button" 
          data-toggle="dropdown">
          <i class="fas fa-cog"></i>
        </button>
        <div class="dropdown-menu dropdown-menu-right">
          <a class="dropdown-item" href="#" (click)="fitToWidth(); $event.preventDefault()">
            <i class="fas fa-arrows-alt-h mr-2"></i>Ajustar al ancho
          </a>
          <a class="dropdown-item" href="#" (click)="fitToPage(); $event.preventDefault()">
            <i class="fas fa-arrows-alt mr-2"></i>Ajustar a la página
          </a>
        </div>
      </div>
    </div>

    <!-- Información -->
    <div class="d-flex align-items-center gap-2">
      <small *ngIf="!loading && pdfDoc">
        <i class="fas fa-file-pdf mr-1"></i>
        {{ totalPages }} página{{ totalPages > 1 ? 's' : '' }}
      </small>
      <div class="spinner-border spinner-border-sm" role="status" *ngIf="loading">
        <span class="sr-only">Cargando...</span>
      </div>
    </div>
  </div>

  <!-- Área de visualización -->
  <div class="pdf-viewport" #pdfContainer>
    <div class="pdf-loading text-center p-5" *ngIf="loading">
      <div class="spinner-border text-primary" role="status">
        <span class="sr-only">Cargando PDF...</span>
      </div>
      <p class="mt-3 text-muted">Cargando documento...</p>
    </div>

    <div class="pdf-error text-center p-5" *ngIf="error && !loading">
      <i class="fas fa-exclamation-triangle fa-3x text-warning mb-3"></i>
      <h5>Error al cargar el PDF</h5>
      <p class="text-muted">{{ error }}</p>
      <button class="btn btn-primary btn-sm" (click)="loadPdf()">
        <i class="fas fa-redo mr-2"></i>Reintentar
      </button>
    </div>

    <div class="pdf-content" *ngIf="!loading && !error">
      <div class="canvas-wrapper" 
           [style.cursor]="enableSignature ? 'crosshair' : 'default'"
           (click)="onCanvasClick($event)">
        <canvas #canvas class="pdf-canvas"></canvas>
        
        <!-- Indicador de posición de firma -->
        <div 
          *ngIf="enableSignature && signaturePosition && signaturePosition.page === currentPage"
          class="signature-marker"
          [style.left.%]="signaturePosition.x"
          [style.top.%]="signaturePosition.y">
          <div class="signature-badge">
            <i class="fas fa-signature"></i>
            <small>Firma</small>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
