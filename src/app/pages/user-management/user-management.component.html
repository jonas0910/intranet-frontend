<div class="content-wrapper">
  <!-- Content Header -->
  <div class="content-header">
    <div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6">
          <h1 class="m-0">
            <i class="fas fa-users mr-2"></i>Gestión de Usuarios
          </h1>
        </div>
        <div class="col-sm-6">
          <ol class="breadcrumb float-sm-right">
            <li class="breadcrumb-item"><a href="#">Inicio</a></li>
            <li class="breadcrumb-item active">Usuarios</li>
          </ol>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="content">
    <div class="container-fluid">
      
      <!-- Botón Agregar Usuario -->
      <div class="row mb-3">
        <div class="col-12">
          <button class="btn btn-success" (click)="openUserForm()">
            <i class="fas fa-plus mr-1"></i>Agregar Usuario
          </button>
        </div>
      </div>

      <!-- Lista de Usuarios -->
      <div class="row">
        <div class="col-12">
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">
                <i class="fas fa-list mr-1"></i>Usuarios Registrados
              </h3>
            </div>
            <div class="card-body">
              <div class="table-responsive">
                <table class="table table-bordered table-striped">
                  <thead>
                    <tr>
                      <th>ID</th>
                      <th>Nombre</th>
                      <th>Email</th>
                      <th>Roles</th>
                      <th>Sistemas</th>
                      <th>Estado</th>
                      <th>Acciones</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr *ngFor="let user of users">
                      <td>{{ user.id }}</td>
                      <td>{{ user.name }}</td>
                      <td>{{ user.email }}</td>
                      <td>
                        <span *ngFor="let role of user.roles" class="badge badge-primary mr-1">
                          {{ role.name }}
                        </span>
                      </td>
                      <td>
                        <span *ngFor="let system of user.systems" class="badge badge-success mr-1">
                          {{ system.nombre }}
                        </span>
                      </td>
                      <td>
                        <span class="badge" [class.badge-success]="user.activo" [class.badge-danger]="!user.activo">
                          {{ user.activo ? 'Activo' : 'Inactivo' }}
                        </span>
                      </td>
                      <td>
                        <div class="btn-group">
                          <button class="btn btn-sm btn-info" (click)="viewUserDetails(user)" title="Ver detalles">
                            <i class="fas fa-eye"></i>
                          </button>
                          <button class="btn btn-sm btn-warning" (click)="editUser(user)" title="Editar">
                            <i class="fas fa-edit"></i>
                          </button>
                          <button class="btn btn-sm btn-danger" (click)="deleteUser(user)" title="Eliminar">
                            <i class="fas fa-trash"></i>
                          </button>
                        </div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Incluir Modal de Usuario -->
<ng-container *ngTemplateOutlet="userFormModal"></ng-container>
