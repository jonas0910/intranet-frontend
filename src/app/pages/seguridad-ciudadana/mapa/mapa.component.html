<app-system-layout [title]="'Mapa de Seguridad Ciudadana'"
  [subtitle]="'Análisis geoespacial de incidentes y mapa de calor de seguridad'" [subtitleItems]="subtitleItems"
  [breadcrumbs]="[{label: 'Inicio', url: '/'}, {label: 'Seguridad Ciudadana', url: '/seguridad-ciudadana'}, {label: 'Mapa de Calor'}]"
  [subsystem]="'seguridad-ciudadana'">

  <!-- Main content -->
  <div class="content p-3">
    <div class="container-fluid bg-white rounded shadow-sm border p-0 overflow-hidden">

      <div class="row m-0">
        <!-- SIDEBAR CONTROLS -->
        <div *ngIf="!isMapExpanded"
          class="col-md-4 col-lg-3 p-0 bg-white border-right shadow-sm sidebar-container animate__animated animate__fadeInLeft">
          <!-- Sidebar Header -->
          <div class="p-3 border-bottom bg-light">
            <h6 class="mb-0 font-weight-bold"><i class="fas fa-filter mr-2"></i>Filtros y Controles</h6>
          </div>

          <!-- SCROLLABLE CONTENT -->
          <div class="scrollable-sidebar p-3" style="height: calc(100vh - 220px); overflow-y: auto">

            <!-- Vista Toggle -->
            <div class="form-group mb-4">
              <label class="small font-weight-bold text-uppercase text-muted mb-2 d-block">Modo de Visualización</label>
              <div class="btn-group btn-group-toggle w-100 shadow-sm" data-toggle="buttons">
                <button class="btn btn-sm btn-outline-primary py-2" [class.active]="vistaActual === 'calor'"
                  (click)="cambiarVista('calor')">
                  <i class="fas fa-fire mr-1"></i> Calor
                </button>
                <button class="btn btn-sm btn-outline-primary py-2" [class.active]="vistaActual === 'marcadores'"
                  (click)="cambiarVista('marcadores')">
                  <i class="fas fa-map-marker-alt mr-1"></i> Puntos
                </button>
              </div>
            </div>

            <hr class="my-4">

            <!-- Filtros de Fecha -->
            <div class="form-group mb-3">
              <label class="small font-weight-bold">Desde Fecha:</label>
              <div class="input-group input-group-sm">
                <div class="input-group-prepend">
                  <span class="input-group-text bg-white border-right-0"><i
                      class="fas fa-calendar-alt text-muted"></i></span>
                </div>
                <input type="date" class="form-control border-left-0 pl-1" [(ngModel)]="filtros.fecha_desde"
                  (change)="aplicarFiltros()">
              </div>
            </div>

            <!-- Filtro Tipo -->
            <div class="form-group mb-4">
              <label class="small font-weight-bold">Tipo de Incidente:</label>
              <select class="form-control form-control-sm custom-select" [(ngModel)]="filtros.tipo"
                (change)="aplicarFiltros()">
                <option value="">Todos los tipos</option>
                <option *ngFor="let tipo of tiposOcurrencia" [value]="tipo.value">
                  {{ tipo.label }}
                </option>
              </select>
            </div>

            <button class="btn btn-sm btn-block btn-outline-secondary mb-4" (click)="limpiarFiltros()">
              <i class="fas fa-eraser mr-1"></i> Limpiar Filtros
            </button>

            <!-- Leyenda Section -->
            <div class="legend-section mt-4 pt-3 border-top">
              <label class="small font-weight-bold text-uppercase text-muted mb-3 d-block">Leyenda de
                Prioridades</label>

              <div class="d-flex flex-column gap-2">
                <div class="d-flex align-items-center mb-2">
                  <span class="dot bg-success mr-2 shadow-sm"></span>
                  <span class="text-xs">Baja</span>
                </div>
                <div class="d-flex align-items-center mb-2">
                  <span class="dot bg-warning mr-2 shadow-sm"></span>
                  <span class="text-xs">Media</span>
                </div>
                <div class="d-flex align-items-center mb-2">
                  <span class="dot bg-orange mr-2 shadow-sm"></span>
                  <span class="text-xs">Alta</span>
                </div>
                <div class="d-flex align-items-center mb-4">
                  <span class="dot bg-danger mr-2 shadow-sm pulse-dot"></span>
                  <span class="text-xs">Crítica</span>
                </div>
              </div>

              <div *ngIf="vistaActual === 'calor'" class="mt-3 p-2 bg-light rounded border text-xxs">
                <p class="mb-2"><strong>Zonas de Calor:</strong> Representan la densidad de incidentes según su peso y
                  prioridad.</p>
                <div
                  style="height: 6px; background: linear-gradient(to right, #00204d, #0055cc, #00b3ff, #7cff00, #ffdd00, #ff3b00); border-radius: 3px;">
                </div>
                <div class="d-flex justify-content-between mt-1 px-1">
                  <span>Baja</span>
                  <span>Alta</span>
                </div>
              </div>
            </div>

          </div>
        </div>

        <!-- MAP AREA -->
        <div [class]="isMapExpanded ? 'fullscreen-map-wrapper' : 'col-md-8 col-lg-9 p-0 position-relative'">

          <!-- Fullscreen Toolbar - only visible when expanded -->
          <div *ngIf="isMapExpanded" class="fullscreen-toolbar">
            <div class="toolbar-left">
              <div class="toolbar-title">
                <i class="fas fa-map"></i>
                MAPA DE SEGURIDAD CIUDADANA
              </div>
            </div>
            <div class="toolbar-actions">
              <button class="toolbar-btn" (click)="aplicarFiltros()" [disabled]="loading" title="Sincronizar">
                <i class="fas fa-sync-alt" [class.fa-spin]="loading"></i> Sincronizar
              </button>
              <button class="toolbar-btn" (click)="vistaActual === 'calor' ? cambiarVista('marcadores') : cambiarVista('calor')" title="Cambiar vista">
                <i class="fas" [class.fa-fire]="vistaActual === 'marcadores'" [class.fa-map-marker-alt]="vistaActual === 'calor'"></i> 
                {{ vistaActual === 'calor' ? 'Ver Puntos' : 'Ver Calor' }}
              </button>
              <span class="toolbar-hint">Presione <kbd>ESC</kbd> para salir</span>
              <button class="toolbar-btn btn-exit" (click)="toggleMapExpanded()" title="Salir de pantalla completa">
                <i class="fas fa-compress"></i> Salir
              </button>
            </div>
          </div>

          <!-- Map Container -->
          <div [class]="isMapExpanded ? 'fullscreen-map-body' : ''" style="height: 100%; width: 100%;">
            <div id="mapa-seguridad" [class]="isMapExpanded ? '' : 'map-full-height shadow-inner'"></div>

            <!-- Loading Overlay -->
            <div *ngIf="loading" class="map-loading-overlay">
              <div class="spinner-border text-primary" role="status">
                <span class="sr-only">Cargando...</span>
              </div>
            </div>

            <!-- Map Overlay Tools (normal mode only) -->
            <div *ngIf="!isMapExpanded" class="map-overlay-tools">
              <div class="btn-group-vertical shadow-sm">
                <button class="btn btn-white btn-sm" (click)="toggleMapExpanded()"
                  [title]="isMapExpanded ? 'Reducir mapa' : 'Agrandar mapa'">
                  <i class="fas fa-expand"></i>
                </button>
                <button class="btn btn-white btn-sm border-top" (click)="aplicarFiltros()" title="Recargar">
                  <i class="fas fa-sync-alt" [class.fa-spin]="loading"></i>
                </button>
              </div>
            </div>

            <!-- Bottom Info Badge -->
            <div class="map-bottom-info shadow-sm" *ngIf="puntosCalor.length > 0">
              <span class="text-xs font-weight-bold">
                <i class="fas fa-info-circle text-primary mr-1"></i>
                {{ puntosCalor.length }} ocurrencias encontradas
              </span>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</app-system-layout>
